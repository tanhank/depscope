# DepScope 容器编排配置：包含 DepScope Go API 与 Next.js Web 展示界面
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: depscope-api
    ports:
      - "8080:8080"
    environment:
      - DEPSCOPE_API_ADDR=0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: depscope-web
    ports:
      - "3000:3000"
    environment:
      - DEPSCOPE_API_BASE_URL=http://api:8080
      - DEPSCOPE_SITE_URL=http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
